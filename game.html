<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>3D Mobile Shooter by talha

  </title>
  <style>
    html,body{height:100%;margin:0}
    canvas{display:block}
    #ui{
      position:fixed;left:0;right:0;bottom:0;top:0;pointer-events:none;
      font-family:system-ui,Segoe UI,Roboto,Arial;
    }
    .btn{position:absolute;pointer-events:auto;opacity:0.9;border-radius:12px;background:rgba(0,0,0,0.35);backdrop-filter:blur(6px);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:center}
    #left{left:12px;bottom:12px;width:84px;height:84px}
    #right{left:110px;bottom:12px;width:84px;height:84px}
    #fire{right:12px;bottom:12px;width:100px;height:100px;border-radius:50%}
    #hud{position:absolute;left:12px;top:12px;color:#fff;pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,0.8)}
    #msg{position:absolute;left:50%;top:20px;transform:translateX(-50%);color:#fff;padding:8px 14px;background:rgba(0,0,0,0.35);border-radius:8px}
    @media(min-width:900px){#left,#right{width:60px;height:60px}}
  </style>
</head>
<body>
<div id="ui">
  <div id="hud">
    <div id="score">Score: 0</div>
    <div id="lives">Lives: 3</div>
  </div>
  <div id="msg">Tap & drag to steer • Tap FIRE or press space to shoot</div>
  <div id="left" class="btn">◀</div>
  <div id="right" class="btn">▶</div>
  <div id="fire" class="btn">FIRE</div>
</div><script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script><script>
// 3D Mobile Shooter — single-file implementation
// - Uses Three.js from CDN
// - Simple third-person shooter: steer ship left/right, shoot enemies
// - Mobile-friendly controls (touch drag + buttons)

let scene, camera, renderer;
let player, playerGroup;
const bullets = [];
const enemies = [];
let lastSpawn = 0;
let score = 0;
let lives = 3;
let lastFire = 0;
let screenTouch = {active:false,x:0,y:0};
let moveDir = 0; // -1 left, 0 neutral, 1 right

const params = {
  enemySpawnInterval: 800,
  enemySpeed: 0.12,
  bulletSpeed: 1.0,
  maxPlayerX: 12,
  difficultyRamp: 0.997 // reduces spawn interval multiplier each second
};

function init(){
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0a0a, 0.01);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0, 6, 26);
  camera.lookAt(0,2,0);

  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // player (visual ship)
  playerGroup = new THREE.Group();
  player = new THREE.Mesh(
    new THREE.ConeGeometry(0.9, 3, 8),
    new THREE.MeshStandardMaterial({color:0x44aaff,metalness:0.6,roughness:0.2})
  );
  player.rotation.x = Math.PI/2;
  player.position.set(0,2,8);
  playerGroup.add(player);

  const engine = new THREE.Mesh(
    new THREE.CylinderGeometry(0.5,0.5,0.6,8),
    new THREE.MeshStandardMaterial({color:0xff6633,emissive:0xff2200,emissiveIntensity:0.6})
  );
  engine.position.set(0,-0.6,-1.1);
  engine.rotation.x = Math.PI/2;
  playerGroup.add(engine);

  scene.add(playerGroup);

  // ground/track
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200, 8, 8),
    new THREE.MeshStandardMaterial({color:0x0f0f12})
  );
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -1;
  scene.add(ground);

  // lights
  const amb = new THREE.AmbientLight(0xffffff, 0.35);
  scene.add(amb);
  const dir = new THREE.DirectionalLight(0xffffff, 0.9);
  dir.position.set(5,10,10);
  scene.add(dir);

  // star-field simple
  const starsGeo = new THREE.BufferGeometry();
  const starCount = 600;
  const pos = new Float32Array(starCount*3);
  for(let i=0;i<starCount;i++){
    pos[i*3] = (Math.random()-0.5)*600;
    pos[i*3+1] = Math.random()*40 - 5;
    pos[i*3+2] = -Math.random()*120 - 10;
  }
  starsGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({size:1,color:0xffffff,opacity:0.8,transparent:true}));
  scene.add(stars);

  window.addEventListener('resize', onResize);
  setupInput();
  animate();
}

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function spawnEnemy(){
  const geometry = new THREE.BoxGeometry(2.4,2.4,2.4);
  const material = new THREE.MeshStandardMaterial({color:0xff4455,metalness:0.2,roughness:0.7});
  const enemy = new THREE.Mesh(geometry, material);
  const x = (Math.random()*2-1) * (params.maxPlayerX - 2);
  const y = Math.random()*6 + 0.5;
  const z = -Math.random()*200 - 30;
  enemy.position.set(x,y,z);
  enemy.userData = {speed: params.enemySpeed + Math.random()*0.06 + score*0.0008, hp:1, radius:1.8};
  scene.add(enemy);
  enemies.push(enemy);
}

function shoot(){
  const now = performance.now();
  if(now - lastFire < 180) return; // fire rate limit
  lastFire = now;
  const geom = new THREE.SphereGeometry(0.18,8,8);
  const mat = new THREE.MeshStandardMaterial({color:0xffff88,emissive:0xffff66,emissiveIntensity:0.9});
  const bullet = new THREE.Mesh(geom, mat);
  // position bullet in front of player
  const worldPos = new THREE.Vector3();
  playerGroup.getWorldPosition(worldPos);
  bullet.position.copy(worldPos);
  bullet.position.z -= 3.2;
  bullet.userData = {vel: new THREE.Vector3(0,0,-params.bulletSpeed), radius:0.25, life:3000, born:performance.now()};
  scene.add(bullet);
  bullets.push(bullet);
}

function setupInput(){
  const leftBtn = document.getElementById('left');
  const rightBtn = document.getElementById('right');
  const fireBtn = document.getElementById('fire');

  leftBtn.addEventListener('touchstart',e=>{e.preventDefault(); moveDir=-1});
  leftBtn.addEventListener('touchend',e=>{e.preventDefault(); moveDir=0});
  rightBtn.addEventListener('touchstart',e=>{e.preventDefault(); moveDir=1});
  rightBtn.addEventListener('touchend',e=>{e.preventDefault(); moveDir=0});
  fireBtn.addEventListener('touchstart',e=>{e.preventDefault(); shoot()});

  leftBtn.addEventListener('mousedown',e=>{moveDir=-1});
  leftBtn.addEventListener('mouseup',e=>{moveDir=0});
  rightBtn.addEventListener('mousedown',e=>{moveDir=1});
  rightBtn.addEventListener('mouseup',e=>{moveDir=0});
  fireBtn.addEventListener('mousedown',e=>{shoot()});

  // drag to steer
  renderer.domElement.addEventListener('touchstart', e=>{
    screenTouch.active=true; screenTouch.x = e.touches[0].clientX; screenTouch.y = e.touches[0].clientY;
  }, {passive:false});
  renderer.domElement.addEventListener('touchmove', e=>{
    if(!screenTouch.active) return;
    const dx = e.touches[0].clientX - screenTouch.x;
    // translate dx into player x target
    const ratio = dx / Math.min(window.innerWidth, window.innerHeight);
    playerGroup.position.x = THREE.MathUtils.clamp(playerGroup.position.x + ratio*20, -params.maxPlayerX, params.maxPlayerX);
    screenTouch.x = e.touches[0].clientX;
  }, {passive:false});
  renderer.domElement.addEventListener('touchend', e=>{screenTouch.active=false});

  // mouse drag
  let md=false, mx=0;
  renderer.domElement.addEventListener('mousedown', e=>{md=true; mx=e.clientX});
  window.addEventListener('mousemove', e=>{ if(md){ const dx = e.clientX-mx; playerGroup.position.x = THREE.MathUtils.clamp(playerGroup.position.x + dx*0.02, -params.maxPlayerX, params.maxPlayerX); mx=e.clientX }});
  window.addEventListener('mouseup', e=>{md=false});

  window.addEventListener('keydown', e=>{
    if(e.code==='Space') shoot();
    if(e.code==='ArrowLeft') playerGroup.position.x = Math.max(playerGroup.position.x-1, -params.maxPlayerX);
    if(e.code==='ArrowRight') playerGroup.position.x = Math.min(playerGroup.position.x+1, params.maxPlayerX);
  });
}

function update(delta){
  // move player by button direction
  if(moveDir!==0){ playerGroup.position.x = THREE.MathUtils.clamp(playerGroup.position.x + moveDir*delta*8, -params.maxPlayerX, params.maxPlayerX); }
  // smooth tilt
  player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, -playerGroup.position.x*0.02, 0.08);

  // spawn enemies
  if(performance.now() - lastSpawn > params.enemySpawnInterval){ spawnEnemy(); lastSpawn = performance.now(); }

  // update bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    b.position.addScaledVector(b.userData.vel, delta*60);
    // remove old bullets
    if(performance.now() - b.userData.born > b.userData.life){ scene.remove(b); bullets.splice(i,1); continue; }
  }

  // update enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    // move forward toward +z
    e.position.z += e.userData.speed * delta * 60; // speed scales
    // simple homing toward player's x
    e.position.x += (playerGroup.position.x - e.position.x) * 0.005 * (1 + score*0.0001);

    // if passes player plane
    if(e.position.z > 20){ // enemy went past player
      scene.remove(e);
      enemies.splice(i,1);
      lives -= 1; updateHUD();
      if(lives <= 0){ gameOver(); }
      continue;
    }

    // collision bullet-enemy
    for(let j=bullets.length-1;j>=0;j--){
      const b = bullets[j];
      const dist = e.position.distanceTo(b.position);
      if(dist < (e.userData.radius + b.userData.radius)){
        // hit
        scene.remove(b); bullets.splice(j,1);
        e.userData.hp -= 1;
        if(e.userData.hp <= 0){
          // explode
          spawnExplosion(e.position);
          scene.remove(e); enemies.splice(i,1);
          score += 12;
          updateHUD();
        } else {
          score += 6; updateHUD();
        }
        break;
      }
    }

    // collision player-enemy
    const playerPos = new THREE.Vector3(); playerGroup.getWorldPosition(playerPos);
    const d2 = e.position.distanceTo(playerPos);
    if(d2 < (e.userData.radius + 1.2)){
      // hit player
      spawnExplosion(e.position);
      scene.remove(e); enemies.splice(i,1);
      lives -= 1; updateHUD();
      if(lives <= 0){ gameOver(); }
    }
  }

  // difficulty ramp: slowly increase enemy speed and spawn frequency
  params.enemySpawnInterval = Math.max(220, params.enemySpawnInterval * Math.pow(params.difficultyRamp, delta*60));
}

function spawnExplosion(pos){
  // quick particle-ish flash
  const g = new THREE.SphereGeometry(0.6, 6,6);
  const m = new THREE.MeshBasicMaterial({color:0xffcc66});
  const mesh = new THREE.Mesh(g,m);
  mesh.position.copy(pos);
  scene.add(mesh);
  setTimeout(()=>scene.remove(mesh), 220);
}

function updateHUD(){
  document.getElementById('score').textContent = 'Score: ' + Math.floor(score);
  document.getElementById('lives').textContent = 'Lives: ' + lives;
}

let lastTime = performance.now();
function animate(time){
  const now = time || performance.now();
  const delta = Math.min(0.033, (now - lastTime)/1000); // clamp delta to avoid big jumps
  lastTime = now;

  // Move camera subtly to follow player
  camera.position.x = THREE.MathUtils.lerp(camera.position.x, playerGroup.position.x*0.4, 0.06);
  camera.lookAt(playerGroup.position.x, 2, 0);

  update(delta);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

function gameOver(){
  document.getElementById('msg').textContent = 'Game Over — Tap to restart';
  // clear enemies and bullets
  enemies.forEach(e=>scene.remove(e)); enemies.length=0;
  bullets.forEach(b=>scene.remove(b)); bullets.length=0;
  // reset
  setTimeout(()=>{
    score = 0; lives = 3; params.enemySpawnInterval = 800; updateHUD(); document.getElementById('msg').textContent = 'Tap & drag to steer • Tap FIRE or press space to shoot';
  }, 300);
}

// Tap restart / fire if tapping center
renderer && null; // ensure JSHint
window.addEventListener('load', ()=>{
  init();
  document.body.addEventListener('touchstart', e=>{
    // if tap on center-ish, shoot
    const t = e.touches[0];
    if(t.clientX > 120 && t.clientX < window.innerWidth - 120){ shoot(); }
    // if game over msg present and lives==0, restart
    if(lives<=0){ score=0; lives=3; updateHUD(); }
  }, {passive:true});
});

</script></body>
</html>
